name: Libretro Core CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libretro-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Linux x86_64, os: ubuntu-24.04, shell: bash, artifact: sm2-libretro-linux-x86_64, binary: sm2_libretro.so}
          - {name: macOS Apple Silicon, os: macos-15, shell: bash, artifact: sm2-libretro-macos-arm64, binary: sm2_libretro.dylib}
          - {name: macOS Intel, os: macos-15-intel, shell: bash, artifact: sm2-libretro-macos-x86_64, binary: sm2_libretro.dylib}
          - {name: Windows x86_64, os: windows-2022, shell: 'msys2 {0}', artifact: sm2-libretro-windows-x86_64, binary: sm2_libretro.dll}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ glslc libvulkan-dev
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja shaderc vulkan-headers
      - name: Windows dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git file
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
            mingw-w64-x86_64-shaderc
            mingw-w64-x86_64-vulkan-headers
      - name: Configure core with software and Vulkan renderers
        run: |
          extra=()
          if [[ "$RUNNER_OS" == Linux ]]; then
            extra+=('-DCMAKE_SHARED_LINKER_FLAGS=-static-libgcc -static-libstdc++')
          elif [[ "$RUNNER_OS" == macOS ]]; then
            extra+=("-DCMAKE_PREFIX_PATH=$(brew --prefix)" '-DCMAKE_OSX_DEPLOYMENT_TARGET=13.0')
          fi
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSM2_BUILD_STANDALONE=OFF -DSM2_BUILD_TESTS=OFF \
            -DSM2_BUILD_LIBRETRO=ON -DSM2_LIBRETRO_VULKAN=ON \
            -DSM2_BUILD_OPENGL_DESKTOP=OFF \
            -DSM2_LIBRETRO_CHECKS=ON -DSM2_LIBRETRO_GPU_CHECKS=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_miniz=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_pugixml=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_lzmasdk=TRUE "${extra[@]}"
      - name: Build
        run: cmake --build build-ci --parallel 3
      - name: Check inputs and Libretro ABI without ROMs
        run: |
          ./build-ci/bin/sm2-libretro-input-checks
          python3 scripts/check-libretro-artifact.py "build-ci/libretro/${{ matrix.binary }}"
      - name: Package core and matching game database
        run: |
          mkdir -p dist/system/sm2-emu
          cp "build-ci/libretro/${{ matrix.binary }}" dist/
          cp sm2_libretro.info LICENSE NOTICE dist/
          cp data/games.xml dist/system/sm2-emu/
          cp CI.md dist/README.md
          git rev-parse HEAD > dist/SOURCE_COMMIT.txt
          python3 -c 'import hashlib,pathlib; p=pathlib.Path("dist"); (p/"SHA256SUMS").write_text("".join(hashlib.sha256(f.read_bytes()).hexdigest()+"  "+f.relative_to(p).as_posix()+"\n" for f in sorted(p.rglob("*")) if f.is_file() and f.name != "SHA256SUMS"))'
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
