# Dedicated clone campaign; reference: data/diagnostic-menus/vf2a.yaml
# Cycle suffixes identify button steps, not assumed parent default values.

[retroarch]
executable = "~/Retro/Apps/RetroArch/Nightly/RetroArch (ARM).app/Contents/MacOS/RetroArch"
core = "../build-libretro-gpu/libretro/sm2_libretro.dylib"
rom_dir = "/Volumes/MacBook External Drive/Retro/_Media/_Multi (MAME)/roms"
system_assets = "../build-libretro-gpu/libretro/system/sm2-emu"
base_config = "~/Library/Application Support/RetroArch/config/retroarch.cfg"

[campaign]
game = "vf2a"
baseline_sample = "base"
output_dir = "../build-libretro-gpu/validation/nvram-campaigns/vf2a"
startup_wait = 5.0
button_hold = 0.06
button_hold_long = 0.5
default_wait = 0.2
settle_before_close = 0.5
close_gap = 0.7
shutdown_timeout = 15.0
window_width = 496
window_height = 384

[core_options]
sm2_renderer = "software"
sm2_initial_nvram_setup = "disabled"
sm2_nvram_settings = "disabled"

[macros]
Enter = ["R3", "WAIT(2.0)", "L3*5", "R3", "WAIT(2.0)"]

[[samples]]
suffix = "base"
sequence = ["@Enter", "WAIT(0.5)", "SCREENSHOT(base)", "R3", "WAIT(1.0)", "L3*6", "R3", "WAIT(6.0)", "CLOSE"]

[[samples]]
suffix = "match-count-1p-step-0"
sequence = ["@Enter", "L3*1", "WAIT(0.5)", "SCREENSHOT(match-count-1p-step-0)", "L3*12", "R3", "WAIT(1.0)", "L3*6", "R3", "WAIT(6.0)", "CLOSE"]

