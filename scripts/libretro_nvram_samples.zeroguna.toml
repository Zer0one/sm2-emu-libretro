[retroarch]
executable = "~/Retro/Apps/RetroArch/Nightly/RetroArch (ARM).app/Contents/MacOS/RetroArch"
core = "../build-libretro/libretro/sm2_libretro.dylib"
rom_dir = "${SM2_ROM_DIR}"
system_assets = "../build-libretro/libretro/system/sm2-emu"
base_config = "~/Library/Application Support/RetroArch/config/retroarch.cfg"

[campaign]
game = "zeroguna"
baseline_sample = "base"
output_dir = "~/Documents/RetroArch/sm2-nvram-analysis/zeroguna/generated"
startup_wait = 7.0
button_hold = 0.06
button_hold_long = 0.5
default_wait = 0.2
settle_before_close = 0.5
close_gap = 0.7
shutdown_timeout = 15.0
window_width = 496
window_height = 384

[macros]
EnterConfig = ["L3", "WAIT(2.0)", "DOWN*4", "B", "WAIT(2.0)"]

[[samples]]
suffix = "base"
sequence = ["@EnterConfig", "SCREENSHOT(base)", "CLOSE"]

[[samples]]
suffix = "credit-mode-same"
sequence = ["@EnterConfig", "SCREENSHOT(credit-mode-same)", "DOWN*10", "B", "WAIT(1.0)", "CLOSE"]

[[samples]]
suffix = "credit-mode-individual"
sequence = ["@EnterConfig", "A*1", "SCREENSHOT(credit-mode-individual)", "DOWN*9", "B", "WAIT(1.0)", "CLOSE"]

