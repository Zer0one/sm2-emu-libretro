[retroarch]
executable = "~/Retro/Apps/RetroArch/Nightly/RetroArch (ARM).app/Contents/MacOS/RetroArch"
core = "../build-libretro/libretro/sm2_libretro.dylib"
rom_dir = "${SM2_ROM_DIR}"
system_assets = "../build-libretro/libretro/system/sm2-emu"
base_config = "~/Library/Application Support/RetroArch/config/retroarch.cfg"

[campaign]
game = "vstriker"
baseline_sample = "base"
output_dir = "~/Documents/RetroArch/sm2-nvram-analysis/vstriker/generated"
startup_wait = 12.0
button_hold = 0.1
button_hold_long = 1.0
default_wait = 0.2
settle_before_close = 0.5
close_gap = 0.7
shutdown_timeout = 20.0
window_width = 496
window_height = 384

[macros]
EnterAssignments = ["L3", "WAIT(7.0)", "R3*2", "WAIT(1.0)", "L3", "WAIT(2.0)"]

[[samples]]
suffix = "base"
sequence = ["@EnterAssignments", "SCREENSHOT(base)", "WAIT(1.0)", "L3", "WAIT(1.0)", "R3*7", "L3", "WAIT(6.0)", "CLOSE"]

[[samples]]
suffix = "advertise-sound-on"
sequence = ["@EnterAssignments", "R3*1", "SCREENSHOT(advertise-sound-on)", "R3*11", "WAIT(1.0)", "L3", "WAIT(1.0)", "R3*7", "L3", "WAIT(6.0)", "CLOSE"]

