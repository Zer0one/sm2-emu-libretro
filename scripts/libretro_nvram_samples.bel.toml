[retroarch]
executable = "~/Retro/Apps/RetroArch/Nightly/RetroArch (ARM).app/Contents/MacOS/RetroArch"
core = "../build-libretro/libretro/sm2_libretro.dylib"
rom_dir = "${SM2_ROM_DIR}"
system_assets = "../build-libretro/libretro/system/sm2-emu"
base_config = "~/Library/Application Support/RetroArch/config/retroarch.cfg"

[campaign]
game = "bel"
baseline_sample = "base"
output_dir = "~/Documents/RetroArch/sm2-nvram-analysis/bel/generated"
startup_wait = 5.0
button_hold = 0.08
button_hold_long = 1.0
default_wait = 0.45
settle_before_close = 0.5
close_gap = 0.7
shutdown_timeout = 20.0
window_width = 496
window_height = 384

[macros]
EnterGameSystem = ["LONG(R3)", "WAIT(3.0)", "L3*2", "R3", "WAIT(2.0)"]

[[samples]]
suffix = "base"
sequence = ["@EnterGameSystem", "SCREENSHOT(base)", "R3", "WAIT(1.0)", "L3*8", "R3", "WAIT(8.0)", "CLOSE"]

[[samples]]
suffix = "coin-credit-setting-01"
sequence = ["@EnterGameSystem", "L3", "SCREENSHOT(coin-credit-setting)", "L3*6", "R3", "WAIT(1.0)", "L3*8", "R3", "WAIT(8.0)", "CLOSE"]

