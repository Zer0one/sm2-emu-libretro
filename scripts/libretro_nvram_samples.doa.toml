suffix = "vjcom-set-count-2"
sequence = ["@EnterGameSystem", "R3*1", "SCREENSHOT(vjcom-set-count)", "R3*11", "L3", "WAIT(1.0)", "R3*6", "L3", "WAIT(8.0)", "CLOSE"]

