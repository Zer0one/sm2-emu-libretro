# Complete dedicated prototype campaign. The known seven-row Game Assignments
# menu is sampled exhaustively so the prototype layout is derived independently
# from the retail parent.

[retroarch]
executable = "~/Retro/Apps/RetroArch/Nightly/RetroArch (ARM).app/Contents/MacOS/RetroArch"
core = "../build-libretro-gpu/libretro/sm2_libretro.dylib"
rom_dir = "/Volumes/MacBook External Drive/Retro/_Media/_Multi (MAME)/roms"
system_assets = "../build-libretro-gpu/libretro/system/sm2-emu"
base_config = "~/Library/Application Support/RetroArch/config/retroarch.cfg"

[campaign]
game = "hotdp"
baseline_sample = "base"
output_dir = "../build-libretro-gpu/validation/nvram-campaigns/hotdp"
startup_wait = 5.0
button_hold = 0.08
button_hold_long = 1.0
default_wait = 0.45
settle_before_close = 0.5
close_gap = 0.7
shutdown_timeout = 20.0
window_width = 496
window_height = 384

[core_options]
sm2_renderer = "software"
sm2_initial_nvram_setup = "disabled"
sm2_nvram_settings = "disabled"

[macros]
EnterGameAssignments = ["R3", "WAIT(2.0)", "L3*7", "R3", "WAIT(2.0)"]

[[samples]]
suffix = "base"
sequence = ["@EnterGameAssignments", "SCREENSHOT(base)", "R3", "WAIT(1.0)", "L3*5", "R3", "WAIT(10.0)", "CLOSE"]


[[samples]]
suffix = "game-difficulty-normal"
sequence = ["@EnterGameAssignments", "L3*1", "SCREENSHOT(game-difficulty-normal)", "L3*7", "R3", "WAIT(1.0)", "L3*5", "R3", "WAIT(10.0)", "CLOSE"]

