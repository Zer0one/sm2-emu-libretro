[retroarch]
executable = "~/Retro/Apps/RetroArch/Nightly/RetroArch (ARM).app/Contents/MacOS/RetroArch"
core = "../build-libretro/libretro/sm2_libretro.dylib"
rom_dir = "${SM2_ROM_DIR}"
system_assets = "../build-libretro/libretro/system/sm2-emu"
base_config = "~/Library/Application Support/RetroArch/config/retroarch.cfg"

[campaign]
game = "von"
baseline_sample = "base"
output_dir = "~/Documents/RetroArch/sm2-nvram-analysis/von/generated"
startup_wait = 7.0
button_hold = 0.1
button_hold_long = 1.0
default_wait = 0.2
settle_before_close = 0.5
close_gap = 0.7
shutdown_timeout = 20.0
window_width = 496
window_height = 384

[macros]
EnterGameAssignments = ["L3", "WAIT(6.0)", "R3*7", "WAIT(1.0)", "L3", "WAIT(2.0)"]

[[samples]]
suffix = "base"
sequence = ["@EnterGameAssignments", "SCREENSHOT(base)", "L3", "WAIT(1.0)", "R3*4", "L3", "WAIT(6.0)", "CLOSE"]

[[samples]]
suffix = "play-time-1p-stage-1-5-90-secs"
sequence = ["@EnterGameAssignments", "R3*1", "SCREENSHOT(play-time-1p-stage-1-5-90-secs)", "R3*19", "L3", "WAIT(1.0)", "R3*4", "L3", "WAIT(6.0)", "CLOSE"]

