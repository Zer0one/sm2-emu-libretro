# SM2-Emu Libretro NVRAM sample campaign.
# Paths support ~ and environment variables.

[retroarch]
executable = "~/Retro/Apps/RetroArch/Nightly/RetroArch (ARM).app/Contents/MacOS/RetroArch"
core = "../build-libretro/libretro/sm2_libretro.dylib"
rom_dir = "${SM2_ROM_DIR}"
system_assets = "../build-libretro/libretro/system/sm2-emu"
base_config = "~/Library/Application Support/RetroArch/config/retroarch.cfg"

[campaign]
game = "vf2"
baseline_sample = "base"
# Optional: use a frontend baseline, or legacy native files for one-time import.
#standard_srm = "~/Documents/RetroArch/sm2-nvram-analysis/vf2/game-base.srm"
#standard_nvram = "~/Documents/RetroArch/sm2-nvram-analysis/vf2/game-base.nv"
#standard_eeprom = "~/Documents/RetroArch/sm2-nvram-analysis/vf2/game-base.eeprom"
output_dir = "~/Documents/RetroArch/sm2-nvram-analysis/vf2/generated"

# Common timings, in real seconds.
startup_wait = 5.0
button_hold = 0.06
button_hold_long = 0.5
default_wait = 0.2
settle_before_close = 0.5
close_gap = 0.7
shutdown_timeout = 15.0
window_width = 496
window_height = 384

[macros]
EnterGameAssignment = ["L3", "WAIT(2.0)", "R3*5", "L3", "WAIT(2.0)"]

[[samples]]
suffix = "base"
sequence = ["@EnterGameAssignment", "SCREENSHOT(base)", "CLOSE"]

[[samples]]
suffix = "match-count-1p-2"
