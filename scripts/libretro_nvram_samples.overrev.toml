suffix = "country-japan"
sequence = ["@EnterGameAssignments", "L3", "WAIT(1.0)", "SCREENSHOT(country-japan)", "R3*4", "L3", "WAIT(1.0)", "R3*2", "L3", "WAIT(1.0)", "R3*6", "L3", "WAIT(6.0)", "CLOSE"]

