suffix = "match-count-1p-2"
sequence = ["@EnterAssignments", "R3*1", "SCREENSHOT(match-count-1p-2)", "R3*17", "WAIT(1.0)", "L3", "WAIT(1.0)", "R3*5", "L3", "WAIT(6.0)", "CLOSE"]

