[retroarch]
executable = "~/Retro/Apps/RetroArch/Nightly/RetroArch (ARM).app/Contents/MacOS/RetroArch"
core = "../build-libretro/libretro/sm2_libretro.dylib"
rom_dir = "${SM2_ROM_DIR}"
system_assets = "../build-libretro/libretro/system/sm2-emu"
base_config = "~/Library/Application Support/RetroArch/config/retroarch.cfg"

[campaign]
game = "airwlkrs"
baseline_sample = "base"
output_dir = "~/Documents/RetroArch/sm2-nvram-analysis/airwlkrs/generated"
startup_wait = 5.0
button_hold = 0.06
button_hold_long = 0.5
default_wait = 0.2
settle_before_close = 0.5
close_gap = 0.7
shutdown_timeout = 15.0
window_width = 496
window_height = 384

[macros]
EnterGameOptions = ["L3", "WAIT(2.0)", "R3*2", "L3", "WAIT(2.0)"]

[[samples]]
suffix = "base"
sequence = ["@EnterGameOptions", "SCREENSHOT(base)", "L3", "WAIT(1.0)", "R3*8", "L3", "WAIT(6.0)", "CLOSE"]

[[samples]]
suffix = "start-button-select-start"
sequence = ["@EnterGameOptions", "R3*1", "SCREENSHOT(start-button-select-start)", "R3*9", "L3", "WAIT(1.0)", "R3*8", "L3", "WAIT(6.0)", "CLOSE"]

