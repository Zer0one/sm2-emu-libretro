[retroarch]
executable = "~/Retro/Apps/RetroArch/Nightly/RetroArch (ARM).app/Contents/MacOS/RetroArch"
core = "../build-libretro-gpu/libretro/sm2_libretro.dylib"
rom_dir = "${SM2_ROM_DIR}"
system_assets = "../build-libretro-gpu/libretro/system/sm2-emu"
base_config = "~/Library/Application Support/RetroArch/config/retroarch.cfg"

[campaign]
game = "vonr"
output_dir = "../build-libretro-gpu/validation/game-settings-gap-fill-20260920/vonr"
startup_wait = 35.0
button_hold = 0.1
button_hold_long = 1.0
default_wait = 0.2
settle_before_close = 0.5
close_gap = 0.7
shutdown_timeout = 20.0
window_width = 496
window_height = 384

[[samples]]
suffix = "menu-navigation"
sequence = ["R3", "WAIT(4.0)", "SCREENSHOT(test-menu)", "L3*6", "WAIT(1.0)", "SCREENSHOT(game-assignments-selected)", "R3", "WAIT(3.0)", "SCREENSHOT(game-assignments)", "CLOSE"]
