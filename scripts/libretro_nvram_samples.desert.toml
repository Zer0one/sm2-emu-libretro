[retroarch]
executable = "~/Retro/Apps/RetroArch/Nightly/RetroArch (ARM).app/Contents/MacOS/RetroArch"
core = "../build-libretro/libretro/sm2_libretro.dylib"
rom_dir = "${SM2_ROM_DIR}"
system_assets = "../build-libretro/libretro/system/sm2-emu"
base_config = "~/Library/Application Support/RetroArch/config/retroarch.cfg"

[campaign]
game = "desert"
baseline_sample = "base"
output_dir = "~/Documents/RetroArch/sm2-nvram-analysis/desert/generated"
startup_wait = 7.0
button_hold = 0.08
button_hold_long = 1.0
default_wait = 0.45
settle_before_close = 0.5
close_gap = 0.7
shutdown_timeout = 20.0
window_width = 496
window_height = 384

[macros]
EnterGameSystem = ["HOLD(L3)", "WAIT(6.0)", "R3*2", "START", "WAIT(2.0)"]

[[samples]]
suffix = "base"
sequence = ["@EnterGameSystem", "SCREENSHOT(base)", "R3*6", "START", "WAIT(1.0)", "RELEASE(L3)", "R3*7", "START", "WAIT(14.0)", "CLOSE"]

