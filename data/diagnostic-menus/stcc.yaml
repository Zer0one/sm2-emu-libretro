schema_version: 1

game:
  set: stcc
  parent: stcc

verification:
  status: verified
  date: "2026-09-11"
  base_revision: f746cdb742ce4cf5c522228a90b11bf20b161158
  core_source_state: base revision plus uncommitted Libretro SAVE_RAM changes
  method: retroarch_scripted_diagnostic_menu
  startup_wait_seconds: 12
  complete_campaign:
    samples: 39
    common_baseline: stcc-base.srm
    persistent_output: ~/Documents/RetroArch/sm2-nvram-analysis/stcc/generated
