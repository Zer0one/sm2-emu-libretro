    root_position: {initial_item: EXIT, service_presses: 7}
    editable_option_count: 10
    persistence_sequence: [select_submenu_EXIT, select_test_menu_EXIT, wait_for_game]
    options:
      - {key: advertise_sound, label: ADVERTISE SOUND, position: 1, value_count: 2, values: ["ON", "OFF"], nvram: {storage: eeprom, offset: 0x10, mask: 0x01, values: [1, 0]}}
      - {key: url_address, label: URL ADDRESS, position: 2, value_count: 2, values: ["ON", "OFF"], nvram: {storage: eeprom, offset: 0x12, mask: 0x10, values: [16, 0]}}
      - key: country
        label: COUNTRY
        position: 3
        value_count: 3
        values: [JAPAN, USA, EXPORT]
        nvram:
          storage: eeprom
          offset: 0x10
          mask: 0x06
          values: [0, 2, 4]
          compound_offsets: [0x18, 0x28]
          compound_values: [[2, 9], [18, 24], [34, 9]]
      - {key: cabinet_type, label: CABINET TYPE, position: 4, value_count: 2, values: [TWIN, DELUX], nvram: {storage: eeprom, offset: 0x10, mask: 0x08, values: [0, 8]}}
      - key: link_type
        label: LINK TYPE
        position: 5
        value_count: 10
        values: [STAND ALONE, CAR 1, CAR 2, CAR 3, CAR 4, CAR 5, CAR 6, CAR 7, CAR 8, RELAY]
        nvram:
          storage: eeprom
          compound_offsets: [0x10, 0x11]
          compound_masks: [0xe0, 0x01]
          values: [[0, 0], [32, 0], [64, 0], [96, 0], [128, 0], [160, 0], [192, 0], [224, 0], [0, 1], [32, 1]]
      - {key: difficulty, label: DIFFICULTY, position: 6, value_count: 4, values: [NORMAL, EASY, HARD, HARDEST], nvram: {storage: eeprom, offset: 0x11, mask: 0x06, values: [0, 2, 4, 6]}}
      - {key: game_mode, label: GAME MODE, position: 7, value_count: 4, values: [NORMAL, SHORT, LONG, GRAND PRIX], nvram: {storage: eeprom, offset: 0x11, mask: 0x18, values: [0, 8, 16, 24]}}
      - {key: default_car, label: DEFAULT CAR, position: 8, value_count: 5, values: [RANDOM, ALFA ROMEO, MERCEDES, OPEL, TOYOTA], nvram: {storage: eeprom, offset: 0x11, mask: 0xe0, values: [0, 32, 64, 96, 128]}}
      - {key: name_entry, label: NAME ENTRY, position: 9, value_count: 4, values: [BEFORE-3, AFTER-3, BEFORE-7, AFTER-7], nvram: {storage: eeprom, offset: 0x12, mask: 0x06, values: [0, 2, 4, 6]}}
      - {key: default_view, label: DEFAULT VIEW, position: 10, value_count: 2, values: [BIRD'S, DRIVER'S], nvram: {storage: eeprom, offset: 0x12, mask: 0x20, values: [32, 0]}}
    commands: [{label: EXIT, position: 0}]
