controls: {profile: sega_service_l3_r3, enter_test_menu: L3, next_item: R3, select_or_change: L3}

nvram_layout:
  storage: eeprom_93c46
  settings_range: {offset: 0x10, size: 25}
  integrity: {checksum_offset: 0x08, size: 2, algorithm: unidentified}
  backup_ram_runtime_mirror:
    first: {offset: 0x0000, size: 1168}
    mirror: {offset: 0x0490, size: 1168}

menus:
