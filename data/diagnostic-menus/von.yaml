    first: {offset: 0x0014, size: 32}
    mirror: {offset: 0x0220, size: 32}
    integrity: {checksum_offset_within_bank: 0, size: 2, algorithm: unidentified}
  field_relationship: backup RAM field offset equals EEPROM field offset plus 0x06; each storage also maintains its own mirror

