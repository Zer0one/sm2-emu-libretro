    upstream_revision: 8b3a468
    executable: sm2-emu_0.9.4_macos_arm64
    method: isolated_native_nvram_with_scripted_operator_inputs
    changed_value_observed_in_menu: "FAVORITE=TIGERS"
    reopened_value_observed_in_menu: "FAVORITE=OFF"
