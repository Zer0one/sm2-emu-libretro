    method: patch shipped EEPROM before boot, update CRC and mirror, then inspect service menu
    tested_option: {key: favorite, requested: TIGERS, observed: TIGERS}
    tested_value: {offset: 0x1e, mirror_offset: 0x3a, encoded: 7}
    checksum_after_patch: 0x4b62
    result: startup_patch_bypasses_missing_game_commit

controls: {profile: sega_service_l3_r3, enter_test_menu: L3, next_item: R3, select_or_change: L3}

nvram_layout:
  storage: eeprom_93c46
  shipped_defaults: [backup1_16kb, eeprom_128b]
  protection_prefix: {offset: 0x08, bytes: [0xfa, 0xe3, 0xa6, 0x29], preserve: true}
  settings_banks:
    first: {offset: 0x0c, size: 28}
    mirror: {offset: 0x28, size: 28}
  integrity:
    checksum_offset_within_bank: 0
    algorithm: sega_crc16_1021_add_init_debdeb
    note: same 28-byte format as Dynamite Baseball, shifted four bytes to preserve the protection prefix
  observation: the service menu changes only volatile work RAM and never commits the settings EEPROM, but a valid EEPROM patched before boot is read correctly

menus:
  game_assignments:
    root_position: {initial_item: EXIT, service_presses: 7}
    editable_option_count: 5
    persistence_sequence_tested: [select_submenu_EXIT, select_test_menu_EXIT, wait_for_game, reload_saved_sram]
    options:
      - {key: game_difficulty, label: GAME DIFFICULTY, position: 1, value_count: 4, values: [NORMAL, HARD, HARDEST, EASY], nvram: {storage: eeprom, offset: 0x1c, mirror_offset: 0x38, values: [1, 2, 3, 0]}}
      - {key: advertise_sound, label: ADVERTISE SOUND, position: 2, value_count: 2, values: ["ON", "OFF"], nvram: {storage: eeprom, offset: 0x1d, mirror_offset: 0x39, values: [1, 0]}}
      - {key: cabinet_type, label: CABINET TYPE, position: 3, value_count: 3, values: [US, CITY, MEGALO], nvram: {storage: eeprom, offset: 0x1f, mirror_offset: 0x3b, values: [2, 0, 1]}}
      - {key: favorite, label: FAVORITE, position: 4, value_count: 9, values: ["OFF", GIANTS, EAGLES, UNICORNS, LIONS, RAIDERS, BEARS, TWINS, TIGERS], nvram: {storage: eeprom, offset: 0x1e, mirror_offset: 0x3a, values: [8, 0, 1, 2, 3, 4, 5, 6, 7], direct_patch_verified: true}}
      - {key: innings, label: INNINGS, position: 5, value_count: 3, values: ["1CREDIT 2INNINGS", "1CREDIT 3INNINGS", "1CREDIT 1INNING"], nvram: {storage: eeprom, offset: 0x21, mirror_offset: 0x3d, values: [1, 2, 0]}}
    commands: [{label: EXIT, position: 0}]
