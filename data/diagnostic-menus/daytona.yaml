game:
  set: daytona
  parent: daytona

schema_version: 1

verification:
  status: verified
  date: "2026-09-11"
  base_revision: f746cdb742ce4cf5c522228a90b11bf20b161158
  core_source_state: base revision plus uncommitted Libretro SAVE_RAM changes
  method: retroarch_scripted_diagnostic_menu
  complete_campaign:
    samples: 29
    common_baseline: daytona-base.srm
    persistent_output: ~/Documents/RetroArch/sm2-nvram-analysis/daytona/generated
    validated: [srm_container, extracted_nvram, extracted_eeprom, screenshots, mirrored_settings_bank, eeprom_word_byte_order, expected_fields, configuration_crc]

nvram_layout:
  storage: backup_ram_with_eeprom_copy
  settings_banks:
    first: {offset: 0x00, size: 128}
    mirror: {offset: 0x80, size: 128}
  eeprom_relation: EEPROM equals the first backup-RAM bank after swapping every 16-bit word's two bytes
  crc: {offset_within_bank: 0x08, byte_order: little_endian, covered_range_within_bank: {offset: 0x0a, size: 118}, algorithm: CRC-16/CCITT, polynomial: 0x1021, initial_value: 0}

controls:
  enter_test_menu: L3
  next_item: R3
  select_or_change: START

menus:
  game_system:
    root_position: {initial_item: EXIT, service_presses: 2}
    editable_option_count: 8
    persistence_sequence: [select_submenu_EXIT, select_test_menu_EXIT, wait_for_game]
    options:
      - {key: link_id, label: LINK ID, position: 1, value_count: 3, values: [MASTER, SLAVE, SINGLE], nvram: {offset: 0x0b, mirror_offset: 0x8b, values: [1, 2, 0]}}
      - {key: car_number, label: CAR NUMBER, position: 2, value_count: 8, values: [1, 2, 3, 4, 5, 6, 7, 8], nvram: {offset: 0x0c, mirror_offset: 0x8c, values: [0, 1, 2, 3, 4, 5, 6, 7]}}
      - {key: cabinet, label: CABINET, position: 3, value_count: 3, values: [TWIN, UPRIGHT, DELUXE], nvram: {offset: 0x1a, mirror_offset: 0x9a, values: [1, 2, 0]}}
      - {key: country, label: COUNTRY, position: 4, value_count: 3, values: [JPN, EXPORT, USA], nvram: {offset: 0x1b, mirror_offset: 0x9b, values: [1, 2, 0]}}
      - {key: difficulty, label: DIFFICULTY, position: 5, value_count: 4, values: [NORMAL, HARD, HARDEST, EASY], nvram: {offset: 0x20, mirror_offset: 0xa0, values: [1, 2, 3, 0]}}
      - {key: advertise_sound, label: ADVERTISE SOUND, position: 6, value_count: 2, values: ["ON", "OFF"], nvram: {offset: 0x19, mirror_offset: 0x99, values: [0, 1]}}
      - {key: game_mode, label: GAME MODE, position: 7, value_count: 3, values: [NORMAL, GRAND PRIX, ENDURANCE], nvram: {offset: 0x1c, mirror_offset: 0x9c, values: [0, 1, 2]}}
      - {key: rival_arrow, label: RIVAL ARROW, position: 8, value_count: 2, values: ["ON", "OFF"], nvram: {offset: 0x1d, mirror_offset: 0x9d, values: [0, 1]}}
    commands:
      - {label: EXIT, position: 0}
