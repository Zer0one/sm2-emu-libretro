      - {key: advertise_sound, label: ADVERTISE SOUND, position: 2, value_count: 2, values: ["OFF", "ON"], nvram: {storage: eeprom, offset: 0x1a, mirror_offset: 0x3a, values: [0, 1]}}
    commands: [{label: EXIT, position: 0}]
